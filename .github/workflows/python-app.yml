name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.13
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - name: JSON Schema is up to date
        run: |
          uv run engmech schema -o /tmp/schema.json
          diff <(python3 -m json.tool --sort-keys schema/engmech.schema.json) <(python3 -m json.tool --sort-keys /tmp/schema.json)

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run pytest --cov --cov-report=term
      - name: Every example solves from the CLI
        shell: bash
        run: |
          for f in src/engmech/examples/*.yaml tests/verification/*.yaml; do
            uv run engmech solve "$f" > /dev/null || { echo "failed: $f"; exit 1; }
          done
