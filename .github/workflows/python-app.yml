name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.13
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - name: JSON Schema is up to date
        run: |
          uv run engmech schema -o /tmp/schema.json
          diff <(python3 -m json.tool --sort-keys schema/engmech.schema.json) <(python3 -m json.tool --sort-keys /tmp/schema.json)

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONWARNDEFAULTENCODING: "1"  # fail on file I/O without an explicit encoding
      PYTHONUTF8: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python-version }}
      - name: Tests, with coverage gates
        shell: bash
        run: |
          uv run pytest --ignore=tests/oracles --cov --cov-report=term --cov-fail-under=90
          # the calculation core is held to a higher standard than presentation code
          uv run coverage report --fail-under=96 --include="*/engmech/solver.py,*/engmech/results.py,*/engmech/diagnostics.py,*/engmech/mass.py,*/engmech/loads.py,*/engmech/joints.py,*/engmech/model.py,*/engmech/inputs.py,*/engmech/units.py,*/engmech/shapes.py,*/engmech/spatial.py"
      - name: Built-in validation suite
        run: uv run engmech validate --report validation-report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: validation-report.html
          retention-days: 90

  oracles:
    name: Cross-checks against independent solvers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.13 --group validation
      - run: uv run pytest tests/oracles -m oracle -v
