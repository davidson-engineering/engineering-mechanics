[project]
name = "engineering-mechanics"
description = "Rigid-body statics, dynamics and mass properties for engineers: unit-aware input files, a CLI, and verified HTML reports"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Matthew Davidson", email = "matthew@davidson.engineering" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pint>=0.24",
  "pydantic>=2.7",
  "ruamel.yaml>=0.18",
  "rich>=13.7",
  "click>=8.1",
  "plotly>=5.22",
  "jinja2>=3.1",
]

[project.scripts]
engmech = "engmech.cli:main"

[project.urls]
repository = "https://github.com/davidson-engineering/engineering-mechanics"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engmech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["engmech"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "E741"]  # I is inertia
