[project]
name = "engmech"
description = "Rigid-body statics, dynamics and mass properties for engineers: unit-aware input files, a CLI, and verified HTML reports"
dynamic = ["version"]  # from engmech.__version__
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Davidson", email = "matthew@davidson.engineering" }]
keywords = [
  "engineering",
  "mechanics",
  "statics",
  "dynamics",
  "rigid body",
  "free-body diagram",
  "reactions",
  "truss",
  "frame",
  "mass properties",
  "inertia",
  "units",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pint>=0.24",
  "pydantic>=2.7",
  "ruamel.yaml>=0.18",
  "rich>=13.7",
  "click>=8.1",
  "plotly>=5.22",
  "jinja2>=3.1",
]

[project.scripts]
engmech = "engmech.cli:main"

[project.urls]
Homepage = "https://github.com/davidson-engineering/engineering-mechanics"
Documentation = "https://github.com/davidson-engineering/engineering-mechanics/tree/main/docs"
Source = "https://github.com/davidson-engineering/engineering-mechanics"
Issues = "https://github.com/davidson-engineering/engineering-mechanics/issues"
Changelog = "https://github.com/davidson-engineering/engineering-mechanics/releases"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6"]
# independent solvers used as test oracles (tests/oracles); not needed to use engmech
validation = ["mujoco>=3.1", "PyNiteFEA>=0.0.100", "trimesh>=4", "manifold3d>=3"]

[build-system]
requires = ["hatchling>=1.27"]  # 1.27: SPDX license expressions (PEP 639)
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/engmech/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engmech"]

[tool.hatch.build.targets.sdist]
# an explicit list, so stray files in a working copy never end up in a release
include = [
  "/src",
  "/tests",
  "/docs",
  "/schema",
  "/scripts",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["oracle: cross-checks against independent solvers (needs the validation dependency group)"]
# EncodingWarning only fires under PYTHONWARNDEFAULTENCODING=1 (set in CI): any file
# access without an explicit encoding breaks on Windows. plotly's own cache is exempt.
filterwarnings = ["error", "ignore::EncodingWarning:plotly.*"]

[tool.coverage.run]
branch = true
source = ["engmech"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "E741"]  # I is inertia
